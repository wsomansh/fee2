<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            height: 70px;
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
        }

        .logo {
            color: white;
            font-size: 30px;
        }

        .links {
            display: flex;
            gap: 30px;
        }

        .links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .links a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            WALIA
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

</body>
</html>
