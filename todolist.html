<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style10.css">
    <!-- Optional: Add Google Fonts for Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="todo"></div>

<script>
(function(){
    const todos = [];
    const todocontainer = document.getElementById("todo");
    
    // Create Input Group
    const inputGroup = document.createElement("div");
    inputGroup.className = "input-group";

    const inputtask = document.createElement("input");
    inputtask.placeholder = "Enter task...";
    inputtask.type = "text";

    // Create Priority Dropdown
    const prioritySelect = document.createElement("select");
    prioritySelect.className = "priority-select";
    const priorities = ["High", "Medium", "Low"];
    priorities.forEach(p => {
        const option = document.createElement("option");
        option.value = p;
        option.textContent = p;
        prioritySelect.append(option);
    });

    const addbtn = document.createElement("button");
    addbtn.textContent = "Add";
    addbtn.className = "add-btn";

    const todolist = document.createElement("div");
    todolist.className = "todo-list";

    inputGroup.append(inputtask, prioritySelect, addbtn);
    todocontainer.append(inputGroup, todolist);

    function rendertask(taskObj){
        const todoitem = document.createElement("div");
        todoitem.className = "todo-item";
        
        // Priority Badge
        const badge = document.createElement("span");
        badge.textContent = taskObj.priority;
        badge.className = `badge ${taskObj.priority.toLowerCase()}`;
        
        const p = document.createElement("p");
        p.textContent = taskObj.text;
        
        const deletebtn = document.createElement("button");
        deletebtn.textContent = "Delete";
        deletebtn.className = "delete-btn";
        
        const editbtn = document.createElement("button");
        editbtn.textContent = "Edit";
        editbtn.className = "edit-btn";
        
        const completebtn = document.createElement("button");
        completebtn.textContent = "Complete";
        completebtn.className = "complete-btn";

        // Complete Logic
        completebtn.addEventListener("click", function(){
            p.style.textDecoration = "line-through";
            p.style.color = "#94a3b8";
            badge.style.opacity = "0.5";
            todoitem.style.background = "#f0fdf4";
            completebtn.remove();
        });

        // Edit Logic
        editbtn.addEventListener("click", function(){
            // 1. Hide original elements so they don't break the layout
            p.style.display = "none";
            badge.style.display = "none";
            deletebtn.style.display = "none";
            editbtn.style.display = "none";
            if (completebtn.parentElement) completebtn.style.display = "none";

            // 2. Create edit controls
            const editinput = document.createElement("input");
            editinput.type = "text";
            editinput.style.flex = "1"; 
            
            const savebtn = document.createElement("button");
            savebtn.textContent = "Save";
            savebtn.className = "complete-btn";
            
            // 3. Add edit controls to the DOM
            todoitem.prepend(editinput, savebtn);
            editinput.value = taskObj.text;
            editinput.focus();
            
            // 4. Save Logic
            savebtn.addEventListener("click", function(){
                const updatedtext = editinput.value.trim();
                
                if(updatedtext){
                    p.textContent = updatedtext;
                    taskObj.text = updatedtext; 
                }
                
                // Remove edit controls
                editinput.remove();
                savebtn.remove();
                
                // Bring back original elements
                p.style.display = "";
                badge.style.display = "";
                deletebtn.style.display = "";
                editbtn.style.display = "";
                if (completebtn.parentElement) completebtn.style.display = "";
            });
        });

        // Delete Logic
        deletebtn.addEventListener("click", function(){
            todoitem.remove();
            const index = todos.indexOf(taskObj);
            if (index > -1) {
                todos.splice(index, 1);
            }
            console.log(todos);
        });
        
        todoitem.append(badge, p, deletebtn, editbtn, completebtn);
        todolist.prepend(todoitem);
    }

    function addtodo(){
        const taskText = inputtask.value.trim();
        const priority = prioritySelect.value;
        
        if(!taskText){
            return;
        }
        
        const taskObj = { text: taskText, priority: priority };
        todos.unshift(taskObj);
        console.log(todos);
        
        rendertask(taskObj);
        inputtask.value = "";
        inputtask.focus();
    }

    addbtn.addEventListener("click", addtodo);
    inputtask.addEventListener("keydown", function(e){
        if(e.key === "Enter"){
            addtodo();
        }
    });
})();
</script>

</body>
</html>
