<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#222;
    font-family:Arial,sans-serif;
}
.meme{
    position:relative;
    width:500px;
    border:8px solid #fff;
    border-radius:15px;
    overflow:hidden;
}
.meme img{
    width:100%;
    display:block;
}
.top,.bottom{
    position:absolute;
    width:100%;
    color:white;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    font-family:Impact,sans-serif;
    text-shadow:2px 2px 5px black;
}
.top{
    top:10px;
}
.bottom{
    bottom:10px;
}
</style>
</head>
<body>

<div class="meme">
    <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=1200" alt="Programming">
    <div class="top">ME: I'LL FIX ONE BUG...</div>
    <div class="bottom">CODE: HERE ARE 15 NEW ONES 💀</div>
</div>

</body>
</html>
